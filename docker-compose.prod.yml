services:
  backend:
    image: intellisupport-backend:prod
    build:
      context: ./backend
      labels:
        org.opencontainers.image.revision: ${BUILD_GIT_SHA:-unknown}
    command: ["uvicorn", "app.main:app", "--workers", "1", "--host", "0.0.0.0", "--port", "8002"]
    env_file: ${PROD_ENV_FILE:-.env.prod}
    environment:
      WEB_CONCURRENCY: "1"
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      RECONCILIATION_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      OUTBOX_HEARTBEAT_PATH: /app/data/outbox-health/heartbeat.json
      OUTBOX_WORKER_MODE: standalone
      TRANSCRIPT_SPOOL_PATH: /app/data/spool/pending_transcripts.json
      LLM_SETTINGS_PATH: /app/data/spool/llm-settings.json
    volumes:
      - transcript_spool:/app/data/spool
      - outbox_health:/app/data/outbox-health:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 512m
    restart: unless-stopped

  outbox:
    image: intellisupport-backend:prod
    env_file: ${PROD_ENV_FILE:-.env.prod}
    environment:
      OUTBOX_WORKER_MODE: standalone
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      RECONCILIATION_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      OUTBOX_HEARTBEAT_PATH: /app/data/outbox-health/heartbeat.json
    volumes:
      - outbox_health:/app/data/outbox-health
    command: ["python", "-m", "app.outbox.standalone"]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    restart: "on-failure:3"

  frontend:
    build:
      context: ./frontend
      labels:
        org.opencontainers.image.revision: ${BUILD_GIT_SHA:-unknown}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
    mem_limit: 320m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    mem_limit: 96m
    restart: unless-stopped

volumes:
  transcript_spool:
  outbox_health:
  caddy_data:
  caddy_config:

name: Live LLM Integration Tests

on:
  workflow_dispatch:

jobs:
  live-llm-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest Live LLM Tests
      env:
        LLM_BASE_URL: https://ollama.com/v1
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_SMALL_MODEL: nemotron-3-super
        LLM_LARGE_MODEL: nemotron-3-super
        LLM_FALLBACK_MODEL: gpt-oss:120b
        LLM_TIMEOUT: 120
        SUPABASE_URL: https://test-project.supabase.co
        SUPABASE_KEY: test-supabase-key-123456
      run: |
        cd backend
        pytest tests/test_semantic_router.py tests/evals/test_semantic_routing.py

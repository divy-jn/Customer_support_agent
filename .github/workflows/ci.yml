name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - phase-2-security-remediation

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit and architecture checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Deterministic tests mock external clients. These values only satisfy
      # settings validation; live credentials are never used in this job.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_KEY: ci-placeholder-key-123456
      JWT_SECRET: ci-only-not-a-production-secret
      AGENT_SECRET: ci-agent-secret
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall app tests -q
      - name: Run deterministic tests
        run: python -m pytest tests -q -m "not llm_eval"

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

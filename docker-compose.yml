version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8002:8002"
    volumes:
      - ./backend/knowledge_base:/app/knowledge_base
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
      - NEXT_PUBLIC_WS_URL=ws://localhost:8002
    depends_on:
      - backend
